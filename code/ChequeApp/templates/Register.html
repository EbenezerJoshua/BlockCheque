{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlockCheque | Register</title>
    <link href="{% static 'style.css' %}" rel="stylesheet" type="text/css" />
    <script>
        function validate(formObj) {
            if(formObj.t1.value.trim().length == 0) {
                alert("Please Enter Username");
                formObj.t1.focus();
                return false;
            }
            if(formObj.t2.value.trim().length == 0) {
                alert("Please Enter Password");
                formObj.t2.focus();
                return false;
            }
            if(formObj.t3.value.trim().length == 0) {
                alert("Please Enter Contact No");
                formObj.t3.focus();
                return false;
            }
            if(isNaN(formObj.t3.value)){
                alert("Contact No must be numeric");
                formObj.t3.focus();
                return false;
            }
            if(formObj.t4.value.trim().length == 0) {
                alert("Please Enter Email Id");
                formObj.t4.focus();
                return false;
            }
            var filter = /^([a-zA-Z0-9_\.\-])+\@([a-zA-Z0-9\.\-])+\.([a-zA-Z]{2,4})+$/;
            if (!filter.test(formObj.t4.value)) {
                alert('Please enter valid email address');
                formObj.t4.focus();
                return false;
            }
            if(formObj.t5.value.trim().length == 0) {
                alert("Please Enter Address");
                formObj.t5.focus();
                return false;
            }
            return true;
        }
    </script>
</head>
<body>

    <header class="header-container">
        <div class="logo-container">
            <h1><span>BlockCheque</span> System</h1>
        </div>
        <nav>
            <ul class="nav-links">
                <li><a href="{% url 'index' %}">Home</a></li>
                <li><a href="{% url 'BankLogin' %}">Bank Login</a></li>
                <li><a href="{% url 'UserLogin' %}">User Login</a></li>
                <li><a href="{% url 'Register' %}">Signup</a></li>
            </ul>
        </nav>
    </header>

    <main class="main-content">
        <div class="form-container glass-panel">
            <h2>Create an Account</h2>
            
            {% if data %}
                <div class="alert alert-error">
                    {{ data }}
                </div>
            {% endif %}

            <form name="f1" method="post" action="{% url 'RegisterAction' %}" onsubmit="return validate(this);">
                {% csrf_token %}
                
                <div class="form-group">
                    <label for="t1">Username</label>
                    <input type="text" name="t1" id="t1" class="form-control" placeholder="Enter username">
                </div>

                <div class="form-group">
                    <label for="t2">Password</label>
                    <input type="password" name="t2" id="t2" class="form-control" placeholder="Enter password">
                </div>

                <div class="form-group">
                    <label for="t3">Contact No</label>
                    <input type="text" name="t3" id="t3" class="form-control" placeholder="Enter contact number">
                </div>

                <div class="form-group">
                    <label for="t4">Email ID</label>
                    <input type="email" name="t4" id="t4" class="form-control" placeholder="Enter email address">
                </div>

                <div class="form-group">
                    <label for="t5">Address</label>
                    <input type="text" name="t5" id="t5" class="form-control" placeholder="Enter your address">
                </div>

                <div class="form-group">
                    <label for="t6">User Type</label>
                    <select name="t6" id="t6" class="form-control">
                        <option value="Bank">Bank</option>
                        <option value="User">User</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary">Submit Registration</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Blockchain Based Cheque Verification & Clearance System.</p>
    </footer>

</body>
</html>
