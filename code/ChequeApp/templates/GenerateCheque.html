{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlockCheque | Generate Cheque</title>
    <link href="{% static 'style.css' %}" rel="stylesheet" type="text/css" />
    <script>
        function validate(formObj) {
            if(formObj.t3.value.trim().length == 0) {
                alert("Please Enter Amount");
                formObj.t3.focus();
                return false;
            }
            if(isNaN(formObj.t3.value) || Number(formObj.t3.value) <= 0) {
                alert("Amount must be a valid positive number");
                formObj.t3.focus();
                return false;
            }
            return true;
        }
    </script>
</head>
<body>

    <header class="header-container">
        <div class="logo-container">
            <h1><span>BlockCheque</span> System</h1>
        </div>
        <nav>
            <ul class="nav-links">
                <li><a href="{% url 'UserDashboard' %}">Dashboard</a></li>
                <li><a href="{% url 'index' %}" style="color: var(--danger);">Logout</a></li>
            </ul>
        </nav>
    </header>

    <main class="main-content">
        <div class="form-container glass-panel">
            <h2>Generate Cheque</h2>
            
            {% if data %}
                <div class="alert alert-success">
                    {{ data }}
                </div>
            {% endif %}

            <form name="f1" method="post" action="{% url 'GenerateChequeAction' %}" onsubmit="return validate(this);">
                {% csrf_token %}
                
                {{ data1|safe }}
                
                <div class="form-group">
                    <label for="t3">Amount</label>
                    <input type="number" name="t3" id="t3" class="form-control" placeholder="Enter amount">
                </div>

                <button type="submit" class="btn btn-primary">Generate Cheque</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Blockchain Based Cheque Verification & Clearance System.</p>
    </footer>

</body>
</html>
