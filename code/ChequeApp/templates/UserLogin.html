{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlockCheque | User Login</title>
    <link href="{% static 'style.css' %}" rel="stylesheet" type="text/css" />
    <script>
        function validate(formObj) {
            if(formObj.t1.value.trim().length == 0) {
                alert("Please Enter Username");
                formObj.t1.focus();
                return false;
            }
            if(formObj.t2.value.trim().length == 0) {
                alert("Please Enter Password");
                formObj.t2.focus();
                return false;
            }
            return true;
        }
    </script>
</head>
<body>

    <header class="header-container">
        <div class="logo-container">
            <h1><span>BlockCheque</span> System</h1>
        </div>
        <nav>
            <ul class="nav-links">
                <li><a href="{% url 'index' %}">Home</a></li>
                <li><a href="{% url 'BankLogin' %}">Bank Login</a></li>
                <li><a href="{% url 'UserLogin' %}">User Login</a></li>
                <li><a href="{% url 'Register' %}">Signup</a></li>
            </ul>
        </nav>
    </header>

    <main class="main-content">
        <div class="form-container glass-panel">
            <h2>User Login</h2>
            
            {% if data %}
                <div class="alert alert-error">
                    {{ data }}
                </div>
            {% endif %}

            <form name="f1" method="post" action="{% url 'UserLoginAction' %}" onsubmit="return validate(this);">
                {% csrf_token %}
                
                <div class="form-group">
                    <label for="t1">Username</label>
                    <input type="text" name="t1" id="t1" class="form-control" placeholder="Enter username">
                </div>

                <div class="form-group">
                    <label for="t2">Password</label>
                    <input type="password" name="t2" id="t2" class="form-control" placeholder="Enter password">
                </div>

                <button type="submit" class="btn btn-primary">Login</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Blockchain Based Cheque Verification & Clearance System.</p>
    </footer>

</body>
</html>
